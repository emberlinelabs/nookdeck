<!-- mid-grey plates under the two Finder icon labels. Finder draws them black (Light) or white (Dark); #6f7a84 is ~4.8:1 against black and ~4.4:1 against white. Keep it opaque: transparency over the dark art would break the black-text contrast. Label centre is at y=273. -->
