name: Release

# Push a tag like v0.2.0 (it must match "version" in package.json) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The same tests on Windows: platform-neutral logic, the win32 builders and the real helper / Credential Manager calls.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  release:
    needs: test-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -n1)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # builds the web apps, the icon catalog and src/assets.gen.ts first, then runs every test
      - name: Test
        run: bun run test

      - name: Build and sign (macOS arm64 + x64), cross-compile Windows x64
        run: |
          mkdir -p dist
          # the Now Playing adapter (vendor/mediaremote-adapter): a universal dylib, embedded into every binary below
          bun scripts/build-mediaremote.ts
          bun run gen-assets
          for arch in arm64 x64; do
            bun build src/index.ts src/platform/mac-worker.ts --compile --target="bun-darwin-$arch" --outfile "dist/phonedesk-darwin-$arch"
            bun scripts/sign-macos.ts "dist/phonedesk-darwin-$arch"
          done
          bun build src/index.ts --compile --target=bun-windows-x64 --outfile dist/phonedesk-windows-x64.exe
          cd dist
          # gzip copies (about a third of the size): the installers prefer them and unpack + verify the binary too
          for f in phonedesk-darwin-arm64 phonedesk-darwin-x64 phonedesk-windows-x64.exe; do gzip -9 -n -k "$f"; done
          shasum -a 256 phonedesk-darwin-arm64 phonedesk-darwin-x64 phonedesk-windows-x64.exe phonedesk-darwin-arm64.gz phonedesk-darwin-x64.gz phonedesk-windows-x64.exe.gz > SHA256SUMS
          cat SHA256SUMS
          ls -l phonedesk-*

      - name: The arm64 binary reports the tagged version
        run: |
          got="$(./dist/phonedesk-darwin-arm64 --version)"
          [ "${got%% (*}" = "phonedesk ${GITHUB_REF_NAME#v}" ] || { echo "::error::binary printed '$got'"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/phonedesk-darwin-arm64 dist/phonedesk-darwin-x64 dist/phonedesk-windows-x64.exe dist/phonedesk-darwin-arm64.gz dist/phonedesk-darwin-x64.gz dist/phonedesk-windows-x64.exe.gz dist/SHA256SUMS \
            --title "PhoneDesk $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes
